<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Maskable icon with safe zone (10% padding on all sides) -->
  <!-- Safe zone: 51.2px from edges -->
  
  <!-- Full bleed background -->
  <rect width="512" height="512" fill="#6366f1"/>
  
  <!-- Calendar body (within safe zone) -->
  <rect x="116" y="132" width="280" height="254" rx="22" fill="white"/>
  
  <!-- Calendar header -->
  <rect x="116" y="132" width="280" height="64" rx="22" fill="#818cf8"/>
  <rect x="116" y="178" width="280" height="18" fill="#818cf8"/>
  
  <!-- Binding rings -->
  <circle cx="186" cy="132" r="14" fill="#6366f1"/>
  <circle cx="186" cy="132" r="7" fill="white"/>
  <circle cx="326" cy="132" r="14" fill="#6366f1"/>
  <circle cx="326" cy="132" r="7" fill="white"/>
  
  <!-- Calendar dates -->
  <g fill="#6366f1" opacity="0.4">
    <!-- Row 1 -->
    <circle cx="151" cy="236" r="9"/>
    <circle cx="196" cy="236" r="9"/>
    <circle cx="241" cy="236" r="9"/>
    <circle cx="286" cy="236" r="9"/>
    <circle cx="331" cy="236" r="9"/>
    <circle cx="361" cy="236" r="9"/>
    
    <!-- Row 2 -->
    <circle cx="151" cy="281" r="9"/>
    <circle cx="196" cy="281" r="9"/>
    <circle cx="241" cy="281" r="9"/>
    <circle cx="286" cy="281" r="9"/>
    <circle cx="331" cy="281" r="9"/>
    <circle cx="361" cy="281" r="9"/>
    
    <!-- Row 3 -->
    <circle cx="151" cy="326" r="9"/>
    <circle cx="196" cy="326" r="9"/>
    <circle cx="241" cy="326" r="9"/>
    <circle cx="286" cy="326" r="9"/>
    <circle cx="331" cy="326" r="9"/>
    <circle cx="361" cy="326" r="9"/>
  </g>
  
  <!-- Highlighted date -->
  <circle cx="286" cy="281" r="20" fill="#6366f1"/>
  <circle cx="286" cy="281" r="9" fill="white"/>
</svg>