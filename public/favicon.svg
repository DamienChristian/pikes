    <circle cx="17" cy="20" r="1"/>
    <circle cx="21" cy="20" r="1"/>
    <circle cx="25" cy="20" r="1"/>
    
    <circle cx="9" cy="24" r="1"/>
    <circle cx="13" cy="24" r="1"/>
    <circle cx="17" cy="24" r="1"/>
    <circle cx="21" cy="24" r="1"/>
  </g>
  
