<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <rect width="512" height="512" rx="80" fill="#6366f1"/>
  
  <!-- Calendar body -->
  <rect x="96" y="128" width="320" height="288" rx="24" fill="white"/>
  
  <!-- Calendar header bar -->
  <rect x="96" y="128" width="320" height="72" rx="24" fill="#818cf8"/>
  <rect x="96" y="176" width="320" height="24" fill="#818cf8"/>
  
  <!-- Top binding rings -->
  <circle cx="176" cy="128" r="16" fill="#6366f1"/>
  <circle cx="176" cy="128" r="8" fill="white"/>
  <circle cx="336" cy="128" r="16" fill="#6366f1"/>
  <circle cx="336" cy="128" r="8" fill="white"/>
  
  <!-- Calendar grid dots (representing dates) -->
  <g fill="#6366f1" opacity="0.4">
    <!-- Row 1 -->
    <circle cx="136" cy="240" r="8"/>
    <circle cx="186" cy="240" r="8"/>
    <circle cx="236" cy="240" r="8"/>
    <circle cx="286" cy="240" r="8"/>
    <circle cx="336" cy="240" r="8"/>
    <circle cx="376" cy="240" r="8"/>
    
    <!-- Row 2 -->
    <circle cx="136" cy="290" r="8"/>
    <circle cx="186" cy="290" r="8"/>
    <circle cx="236" cy="290" r="8"/>
    <circle cx="286" cy="290" r="8"/>
    <circle cx="336" cy="290" r="8"/>
    <circle cx="376" cy="290" r="8"/>
    
    <!-- Row 3 -->
    <circle cx="136" cy="340" r="8"/>
    <circle cx="186" cy="340" r="8"/>
    <circle cx="236" cy="340" r="8"/>
    <circle cx="286" cy="340" r="8"/>
    <circle cx="336" cy="340" r="8"/>
    <circle cx="376" cy="340" r="8"/>
  </g>
  
  <!-- Highlighted date (today) -->
  <circle cx="286" cy="290" r="20" fill="#6366f1"/>
  <circle cx="286" cy="290" r="8" fill="white"/>
</svg>